name: Publish notes to WordPress

on:
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
      - "wordpress/scripts/**"
      - "wordpress/package*.json"
      - ".github/workflows/publish-wordpress.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Commit before the changes to republish (compare against current main)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wordpress-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wordpress/package-lock.json
      - run: npm ci
        working-directory: wordpress
      - run: npm test
        working-directory: wordpress

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wordpress/package-lock.json

      - name: Install publisher dependencies
        working-directory: wordpress
        run: npm ci

      - name: Publish changed notes
        working-directory: wordpress
        env:
          BEFORE: ${{ github.event.before || inputs.base_ref }}
          AFTER: ${{ github.sha }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/publish-changed-notes.mjs

      # publish-to-wordpress.mjs tracks file->post-ID mappings in
      # post-mapping.json so re-publishing a note updates it in place
      # instead of creating a duplicate post. Commit that file back so the
      # mapping survives between workflow runs (each run starts from a
      # fresh checkout, so without this the mapping created above would be
      # thrown away and the next run would never know posts already exist).
      - name: Commit updated post-mapping.json
        if: always() && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- wordpress/post-mapping.json; then
            git add wordpress/post-mapping.json
            git commit -m "Update post-mapping.json [skip ci]"
            git push
          fi

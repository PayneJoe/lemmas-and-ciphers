name: Publish notes to WordPress

on:
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wordpress/package-lock.json

      - name: Install publisher dependencies
        working-directory: wordpress
        run: npm ci

      - name: Find changed notes
        id: changed
        run: |
          files=$(git diff --name-only HEAD^ HEAD -- 'docs/**/*.md' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Publish changed notes
        if: steps.changed.outputs.files != ''
        working-directory: wordpress
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          for f in ${{ steps.changed.outputs.files }}; do
            node scripts/publish-to-wordpress.mjs "../$f"
          done

      - name: Refresh section hub pages
        if: steps.changed.outputs.files != ''
        working-directory: wordpress
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/generate-section-pages.mjs

      # publish-to-wordpress.mjs tracks file->post-ID mappings in
      # post-mapping.json so re-publishing a note updates it in place
      # instead of creating a duplicate post. Commit that file back so the
      # mapping survives between workflow runs (each run starts from a
      # fresh checkout, so without this the mapping created above would be
      # thrown away and the next run would never know posts already exist).
      - name: Commit updated post-mapping.json
        if: steps.changed.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- wordpress/post-mapping.json; then
            git add wordpress/post-mapping.json
            git commit -m "Update post-mapping.json [skip ci]"
            git push
          fi
